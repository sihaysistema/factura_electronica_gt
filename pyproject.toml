[project]
name = "factura_electronica"
authors = [
    { name = "SHS", email = "m.monroy123ap@gmail.com"}
]
description = "Aplicacion para la generacion de facturas electronicas en guatemala."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Core dependencies. Frappe and ERPNext come from the bench, not pip.
    "numinwords",
    "numpy",
    "pandas",
    "reportlab",
    "xmltodict",
    "pyopenssl",
    "xlsxwriter",
]

[tool.bench.frappe-dependencies]
frappe = ">=15,<16"
erpnext = ">=15,<16"


[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
